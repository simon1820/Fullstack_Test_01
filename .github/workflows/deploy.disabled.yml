name: deploy

on:
  push:
    branches:
      - test/simonandresguijarromurrieta

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # ESTE PASO ES IMPORTANTE
      - name: Debug Railway project
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway status

      - name: Deploy Monolith
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service "Fullstack_Test_01" --ci --verbose