name: deploy

on:
  push:
    branches:
      - test/simonandresguijarromurrieta

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Set Railway Token
        run: echo "RAILWAY_TOKEN=${{ secrets.RAILWAY_TOKEN }}" >> $GITHUB_ENV

      # 👇 NUEVO STEP
      - name: Show Railway Project Info
        run: railway status --json

      - name: Deploy Monolith
        run: railway up --ci --verbose
